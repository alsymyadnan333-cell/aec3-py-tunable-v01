name: Build AEC3 Tunable Windows Wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build Python 3.12 x64 Tunable Wheel (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Set up Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Log Toolchain Versions
        shell: bash
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Install Maturin
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.0,<2.0"
          maturin --version

      - name: Build Release Wheel (Locked)
        shell: bash
        run: |
          maturin build --release --locked --out dist

      - name: Compute SHA256 & List Artifacts
        shell: bash
        run: |
          ls -la dist/
          sha256sum dist/*.whl

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aec3-py-diagnostic-cp312-windows-x64
          path: dist/*.whl
          if-no-files-found: error
